name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: |
          uv build

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: WebSpan ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
          fail_on_unmatched_files: true